apiVersion: v1
kind: Service
metadata:
  name: {{ include "food-delivery.fullname" . }}-keydb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "food-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: keydb
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: keydb
  selector:
    {{- include "food-delivery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keydb
