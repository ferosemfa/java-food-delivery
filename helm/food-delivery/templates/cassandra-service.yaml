apiVersion: v1
kind: Service
metadata:
  name: {{ include "food-delivery.fullname" . }}-cassandra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "food-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: cassandra
spec:
  type: ClusterIP
  ports:
    - port: 9042
      targetPort: 9042
      protocol: TCP
      name: cql
  selector:
    {{- include "food-delivery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cassandra
