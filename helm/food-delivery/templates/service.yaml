apiVersion: v1
kind: Service
metadata:
  name: {{ include "food-delivery.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "food-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "food-delivery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
