apiVersion: apps/v1
kind: Deployment
metadata:
  name: keydb
  namespace: food-delivery
  labels:
    app: food-delivery
    component: keydb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: food-delivery
      component: keydb
  template:
    metadata:
      labels:
        app: food-delivery
        component: keydb
    spec:
      containers:
        - name: keydb
          image: eq-alpha/keydb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              protocol: TCP
              name: keydb
          readinessProbe:
            exec:
              command:
                - keydb-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - keydb-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: keydb-data
              mountPath: /data
      volumes:
        - name: keydb-data
          persistentVolumeClaim:
            claimName: keydb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keydb-pvc
  namespace: food-delivery
  labels:
    app: food-delivery
    component: keydb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
