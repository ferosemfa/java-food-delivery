apiVersion: v1
kind: ConfigMap
metadata:
  name: food-delivery-config
  namespace: food-delivery
data:
  app.properties: |
    SPRING_PROFILES_ACTIVE=production
    CASSANDRA_KEYSPACE=food_delivery
    JWT_EXPIRATION=86400000
  CASSANDRA_HOSTS: cassandra-service
  KAFKA_BROKER_URL: kafka-service:9092
  KEYDB_HOST: keydb-service
