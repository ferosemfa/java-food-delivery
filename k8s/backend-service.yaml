apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: food-delivery
  labels:
    app: food-delivery
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: food-delivery
    component: backend
